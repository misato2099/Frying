name: 每日股票量化技術分析

on:
  schedule:
    # 1. 台股：週一至週五 UTC 00:00 (台灣時間 08:00)
    - cron: '0 0 * * 1-5'
    # 2. 歐股：週一至週五 UTC 06:30 (台灣時間 14:30 / 歐股開市前 08:30)
    - cron: '30 6 * * 1-5'
    # 3. 美股：週一至週五 UTC 13:00 (台灣時間 21:00 / 美股開市前 09:00)
    - cron: '0 13 * * 1-5'

  # 支援手動點擊執行測試
  workflow_dispatch:
    inputs:
      market:
        description: '選擇要分析的市場'
        required: true
        default: 'all'
        type: choice
        options:
          - tw
          - eu
          - us
          - all
      force:
        description: '是否強制執行（略過週末檢核）'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install yfinance pandas numpy requests scipy google-genai
          fi

      - name: 精準判定市場並啟動分析
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e

          # 檢查是否帶入 --force 參數
          EXTRA_FLAGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            EXTRA_FLAGS="--force"
          fi

          # 手動觸發時：直接採用選單選擇的市場
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_MARKET="${{ inputs.market }}"
            echo "👉 手動觸發分析市場: $TARGET_MARKET"
            python stock_cycle.py --market "$TARGET_MARKET" $EXTRA_FLAGS
            exit 0
          fi

          # 自動排程觸發時：依 UTC 當前小時寬鬆分流（容忍 GitHub Actions 延遲）
          # UTC 23:00~03:00 (台灣 07:00~11:00) -> 跑台股 (tw)
          # UTC 05:00~09:00 (台灣 13:00~17:00) -> 跑歐股 (eu)
          # UTC 11:00~16:00 (台灣 19:00~00:00) -> 跑美股 (us)
          UTC_HOUR=$(env -u TZ date -u +%-H)
          echo "🕒 系統排程觸發當下 UTC 小時: $UTC_HOUR"

          if [ "$UTC_HOUR" -ge 5 ] && [ "$UTC_HOUR" -le 9 ]; then
            TARGET_MARKET="eu"
          elif [ "$UTC_HOUR" -ge 11 ] && [ "$UTC_HOUR" -le 16 ]; then
            TARGET_MARKET="us"
          else
            TARGET_MARKET="tw"
          fi

          echo "🚀 自動分流鎖定市場: $TARGET_MARKET"
          python stock_cycle.py --market "$TARGET_MARKET" $EXTRA_FLAGS
