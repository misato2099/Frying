name: Daily Stock Analyzer

on:
  schedule:
    # 國際標準時間 06:30，即台灣時間 14:30（週一至週五）
    - cron: '30 6 * * 1-5'
  workflow_dispatch: # 保留這個設定，才能在網頁上手動點擊測試

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 複製專案原始碼
      uses: actions/checkout@v3

    - name: 2. 安裝 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 3. 安裝必備套件
      run: |
        pip install yfinance google-generativeai requests pandas numpy

    - name: 4. 執行分析程式
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      run: python main.py
