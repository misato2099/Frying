name: TW Stock Analyzer (AUO)

on:
  schedule:
    # GitHub cron 使用 UTC
    # 06:10 UTC = 台灣時間 14:10
    - cron: "10 6 * * 1-5"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tw-stock-analyzer-auo
  cancel-in-progress: false

jobs:
  run-tw-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 下載 Repository
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade \
            yfinance \
            google-genai \
            requests \
            pandas \
            numpy

      - name: 顯示套件版本
        run: |
          python --version
          pip show yfinance google-genai pandas numpy requests scipy

      - name: 執行台股分析
        env:
          TZ: Asia/Taipei
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u tw_stock.py

      - name: 上傳計算明細
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auo-calculation-${{ github.run_id }}
          path: tw_stock_calculation.csv
          if-no-files-found: ignore
          retention-days: 14
