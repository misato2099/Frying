name: TW Stock Analyzer (AUO)

on:
  schedule:
    # GitHub Actions cron 使用 UTC
    # 06:10 UTC = 台灣時間 14:10，避開 13:30 收盤後資料尚未更新完成的時間
    - cron: "10 6 * * 1-5"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tw-stock-analyzer-auo
  cancel-in-progress: false

jobs:
  run-tw-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 下載 Repository
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install yfinance google-generativeai requests pandas numpy

      - name: 執行台股分析
        env:
          TZ: Asia/Taipei
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tw_stock.py
