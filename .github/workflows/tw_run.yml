name: TW Stock Analyzer (AUO)

on:
  schedule:
    - cron: '30 6 * * 1-5' # 台灣時間 14:30
  workflow_dispatch:

jobs:
  run-tw-bot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: 安裝套件
      run: pip install yfinance google-generativeai requests pandas numpy
    - name: 執行台股分析
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      run: python tw_stock.py # 關鍵：指定執行台股檔案
