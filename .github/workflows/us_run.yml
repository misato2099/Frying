name: US Stock Analyzer (FCX)

on:
  schedule:
    - cron: '0 10 * * 1-5' # 台灣時間 21:00
  workflow_dispatch:

jobs:
  run-us-bot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: 安裝套件
      run: pip install yfinance google-generativeai requests pandas numpy
    - name: 執行美股分析
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      run: python us_stock.py # 關鍵：指定執行美股檔案
